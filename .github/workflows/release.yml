name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test release readiness
        shell: powershell
        run: |
          ./scripts/tests/release-readiness.tests.ps1
          ./scripts/tests/update-lock.tests.ps1

  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release:
    needs: [release-please, release-validation]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build frontend
        working-directory: apps/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Publish self-contained Windows application
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE_TAG#v}"
          dotnet publish apps/backend/src/Web/SessionInsights.Web.csproj \
            --configuration Release \
            --runtime win-x64 \
            --self-contained true \
            --output release/app \
            -p:Version="$version" \
            -p:IncludeSourceRevisionInInformationalVersion=false
          mkdir -p release/app/wwwroot
          cp -R apps/frontend/dist/. release/app/wwwroot/
          cp scripts/tray.ps1 release/app/tray.ps1
          cp scripts/update-release.ps1 release/app/update-release.ps1
          cp scripts/uninstall-task.ps1 release/app/uninstall-task.ps1
          cp -R scripts release/scripts
      - name: Package release and checksum
        run: |
          cd release
          zip -qr ../SessionInsights-win-x64.zip app scripts
          cd ..
          sha256sum SessionInsights-win-x64.zip > SessionInsights-win-x64.zip.sha256
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            SessionInsights-win-x64.zip \
            SessionInsights-win-x64.zip.sha256 \
            --clobber

  installer:
    needs: [release-please, release]
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Download the release archive
        shell: bash
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern SessionInsights-win-x64.zip
          7z x SessionInsights-win-x64.zip -orelease
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue)?.Source ?? "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $version = $env:RELEASE_TAG.TrimStart('v')
          & $iscc "/DAppVersion=$version" "/DSourceDir=$PWD\release" scripts\installer\SessionInsights.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed.' }
          $setup = 'scripts\installer\output\SessionInsights-Setup.exe'
          "$((Get-FileHash $setup -Algorithm SHA256).Hash.ToLower())  SessionInsights-Setup.exe" | Set-Content -NoNewline -Path "$setup.sha256"
      - name: Upload installer
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            scripts/installer/output/SessionInsights-Setup.exe \
            scripts/installer/output/SessionInsights-Setup.exe.sha256

  publish:
    needs: [release-please, installer]
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish completed release
        run: |
          gh release view "$RELEASE_TAG" --json isDraft,assets \
            --jq '.isDraft and ([.assets[] | select(.state == "uploaded") | .name] |
              (index("SessionInsights-win-x64.zip") != null and
               index("SessionInsights-win-x64.zip.sha256") != null and
               index("SessionInsights-Setup.exe") != null and
               index("SessionInsights-Setup.exe.sha256") != null))' | grep -qx true
          gh release edit "$RELEASE_TAG" --draft=false
