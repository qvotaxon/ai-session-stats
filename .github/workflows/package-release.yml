name: Package release

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      ref:
        type: string
        required: true
      preview:
        type: boolean
        default: false
      pr:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: package-${{ inputs.tag }}
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  RELEASE_TAG: ${{ inputs.tag }}
  RELEASE_REF: ${{ inputs.ref }}
  PREVIEW: ${{ inputs.preview }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Build frontend
        working-directory: apps/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Publish self-contained Windows application
        run: |
          if [[ "$PREVIEW" == true ]]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-preview$ ]]
          else
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          fi
          version="${RELEASE_TAG#v}"
          dotnet publish apps/backend/src/Web/SessionInsights.Web.csproj \
            --configuration Release \
            --runtime win-x64 \
            --self-contained true \
            --output release/app \
            -p:Version="$version" \
            -p:IncludeSourceRevisionInInformationalVersion=false
          mkdir -p release/app/wwwroot
          cp -R apps/frontend/dist/. release/app/wwwroot/
          cp scripts/tray.ps1 release/app/tray.ps1
          cp scripts/update-release.ps1 release/app/update-release.ps1
          cp scripts/uninstall-task.ps1 release/app/uninstall-task.ps1
          cp scripts/start-session-insights.ps1 release/app/start-session-insights.ps1
          cp -R scripts release/scripts
      - name: Package release and checksum
        run: |
          cd release
          zip -qr ../SessionInsights-win-x64.zip app scripts
          cd ..
          sha256sum SessionInsights-win-x64.zip > SessionInsights-win-x64.zip.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-archive
          if-no-files-found: error
          path: |
            SessionInsights-win-x64.zip
            SessionInsights-win-x64.zip.sha256

  installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-archive
      - name: Extract the release archive
        shell: bash
        run: |
          sha256sum --check SessionInsights-win-x64.zip.sha256
          7z x SessionInsights-win-x64.zip -orelease
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.6.1.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_6_1/innosetup-6.6.1.exe' -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne 'd243ce440c02705530699554fb9612b9b2bd7a2a90629cdb7f41e66f5faeb91f') {
            throw 'Inno Setup checksum mismatch.'
          }
          $directory = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $process = Start-Process $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /DIR=`"$directory`"" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)." }
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path $env:RUNNER_TEMP 'InnoSetup\ISCC.exe'
          $version = $env:RELEASE_TAG.TrimStart('v')
          & $iscc "/DAppVersion=$version" "/DSourceDir=$PWD\release" scripts\installer\SessionInsights.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed.' }
          $setup = 'scripts\installer\output\SessionInsights-Setup.exe'
          "$((Get-FileHash $setup -Algorithm SHA256).Hash.ToLower())  SessionInsights-Setup.exe" | Set-Content -NoNewline -Path "$setup.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-installer
          if-no-files-found: error
          path: |
            scripts/installer/output/SessionInsights-Setup.exe
            scripts/installer/output/SessionInsights-Setup.exe.sha256

  publish:
    needs: installer
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          merge-multiple: true
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          if [[ "$PREVIEW" == true ]]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-preview$ ]]
            pr="$(gh pr view "$PR_NUMBER" --json state,headRefOid)"
            if ! echo "$pr" | jq -e --arg sha "$RELEASE_REF" '.state == "OPEN" and .headRefOid == $sha'; then
              echo "::error::Release PR changed or closed; refusing to publish this obsolete preview."
              exit 1
            fi
            releases="$(gh api --paginate "repos/$GH_REPO/releases" | jq -s 'add')"
            if echo "$releases" | jq -e --arg tag "$RELEASE_TAG" 'any(.[]; .tag_name == $tag)' >/dev/null; then
              gh release edit "$RELEASE_TAG" --draft=true --prerelease --latest=false
              exists=true
            else
              exists=false
            fi
            refs="$(gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG")"
            if echo "$refs" | jq -e --arg ref "refs/tags/$RELEASE_TAG" 'any(.[]; .ref == $ref)' >/dev/null; then
              gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$RELEASE_TAG" -f sha="$RELEASE_REF" -F force=true
            else
              gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$RELEASE_REF"
            fi
            if [[ "$exists" == false ]]; then
              gh release create "$RELEASE_TAG" --target "$RELEASE_REF" --draft --prerelease --latest=false \
                --title "$RELEASE_TAG (Preview)" \
                --notes "Manual-install preview of release PR #$PR_NUMBER at $RELEASE_REF. Download and run SessionInsights-Setup.exe to replace your current installation. Preview builds are never offered by the updater. This release's assets are replaced when the release PR changes."
            fi
          else
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          fi
          gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft | grep -qx true
          sha256sum --check SessionInsights-win-x64.zip.sha256
          sha256sum --check SessionInsights-Setup.exe.sha256
          gh release upload "$RELEASE_TAG" --clobber \
            SessionInsights-win-x64.zip \
            SessionInsights-win-x64.zip.sha256 \
            SessionInsights-Setup.exe \
            SessionInsights-Setup.exe.sha256
          gh release view "$RELEASE_TAG" --json isDraft,assets \
            --jq '.isDraft and ([.assets[] | select(.state == "uploaded") | .name] |
              (index("SessionInsights-win-x64.zip") != null and
               index("SessionInsights-win-x64.zip.sha256") != null and
               index("SessionInsights-Setup.exe") != null and
               index("SessionInsights-Setup.exe.sha256") != null))' | grep -qx true
          if [[ "$PREVIEW" == true ]]; then
            pr="$(gh pr view "$PR_NUMBER" --json state,headRefOid)"
            if ! echo "$pr" | jq -e --arg sha "$RELEASE_REF" '.state == "OPEN" and .headRefOid == $sha'; then
              echo "::error::Release PR changed or closed; leaving this obsolete preview as a draft."
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false \
              --notes "Manual-install preview of release PR #$PR_NUMBER at $RELEASE_REF. Download and run SessionInsights-Setup.exe to replace your current installation. Preview builds are never offered by the updater. This release's assets are replaced when the release PR changes."
          else
            gh release edit "$RELEASE_TAG" --draft=false
          fi
