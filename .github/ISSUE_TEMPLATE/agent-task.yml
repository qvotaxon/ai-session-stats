name: "Agent task"
description: "A scoped task for an AI agent or a person. The owner reviews it and applies the labels."
body:
  - type: markdown
    attributes:
      value: |
        Read [CONTRIBUTING.md](https://github.com/qvotaxon/ai-session-stats/blob/main/CONTRIBUTING.md) first.
        Filing this form does not make the issue available to agents: the owner reviews it and applies the labels.
  - type: textarea
    id: context
    attributes:
      label: "Context"
      description: "What is wrong or missing, and why it matters."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "Evidence"
      description: "File paths with line numbers, logs or links that show the current state."
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "Acceptance criteria"
      description: "One checkbox per outcome that can be verified."
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: "Out of scope"
      description: "What this issue must not change."
  - type: textarea
    id: agent-notes
    attributes:
      label: "Agent notes"
      description: "Where to start, which skill to load, what not to touch."
  - type: textarea
    id: depends-on
    attributes:
      label: "Depends on"
      description: "Issues that must be closed before work starts."
      placeholder: "None, or #n, #m"
