name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test release readiness
        shell: powershell
        run: |
          ./scripts/tests/release-readiness.tests.ps1
          ./scripts/tests/update-lock.tests.ps1

  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release:
    needs: [release-please, release-validation]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build frontend
        working-directory: apps/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Publish self-contained Windows application
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE_TAG#v}"
          dotnet publish apps/backend/src/Web/SessionInsights.Web.csproj \
            --configuration Release \
            --runtime win-x64 \
            --self-contained true \
            --output release/app \
            -p:Version="$version" \
            -p:IncludeSourceRevisionInInformationalVersion=false
          mkdir -p release/app/wwwroot
          cp -R apps/frontend/dist/. release/app/wwwroot/
          cp scripts/tray.ps1 release/app/tray.ps1
          cp scripts/update-release.ps1 release/app/update-release.ps1
          cp -R scripts release/scripts
      - name: Package release and checksum
        run: |
          cd release
          zip -qr ../SessionInsights-win-x64.zip app scripts
          cd ..
          sha256sum SessionInsights-win-x64.zip > SessionInsights-win-x64.zip.sha256
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            SessionInsights-win-x64.zip \
            SessionInsights-win-x64.zip.sha256 \
            --clobber
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --json isDraft,assets \
            --jq '.isDraft and ([.assets[] | select(.state == "uploaded") | .name] |
              (index("SessionInsights-win-x64.zip") != null and
               index("SessionInsights-win-x64.zip.sha256") != null))' | grep -qx true
          gh release edit "$RELEASE_TAG" --draft=false
