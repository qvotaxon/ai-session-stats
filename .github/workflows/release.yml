name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build frontend
        working-directory: apps/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Publish self-contained Windows application
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE_VERSION#v}"
          dotnet publish apps/backend/src/Web/SessionInsights.Web.csproj \
            --configuration Release \
            --runtime win-x64 \
            --self-contained true \
            --output release/app \
            -p:Version="$version" \
            -p:IncludeSourceRevisionInInformationalVersion=false
          mkdir -p release/app/wwwroot
          cp -R apps/frontend/dist/. release/app/wwwroot/
          cp scripts/tray.ps1 release/app/tray.ps1
          cp scripts/update-release.ps1 release/app/update-release.ps1
          cp -R scripts release/scripts
      - name: Package release and checksum
        run: |
          cd release
          zip -qr ../SessionInsights-win-x64.zip app scripts
          cd ..
          sha256sum SessionInsights-win-x64.zip > SessionInsights-win-x64.zip.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            SessionInsights-win-x64.zip \
            SessionInsights-win-x64.zip.sha256 \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
